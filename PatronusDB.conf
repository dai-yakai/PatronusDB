################################### NETWORK ##################################
# network_mode
# 1: reactor, 2: ntyco, 3: io_uring
##############################################################################
port 8888
network_mode 1

################################# REPLICATION ################################
is_replication no
master_ip 192.168.137.221
master_port 8888
is_slave no

################################ LOG  ################################
#0: no; 1: info, debug, error; 2: debug, error; 3: error
log_level 1

################################ PERSISTENCE  ################################

# The filename where to dump the DB
dump_dir ./dump/dump.dump
# yes - aof, no - rdb
is_aof no
is_backup no

################################ MEMORY ######################################
max_memory 1073741824

init_dpdk ./pdb_dpdk.ini
dpdk_log ./log/dpdk_init.log